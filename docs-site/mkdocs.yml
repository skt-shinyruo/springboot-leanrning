site_name: Spring Boot Learning（文档站）
site_description: 文档总目录（docs/SUMMARY.md）+ 模块文档（*/docs）
# docs_dir 指向仓库根时，site_dir 必须位于 docs_dir 之外（否则会触发“输出目录复制进自身”的错误）
site_dir: ../../.site-springboot-learning
# 以仓库根作为 docs_dir，便于直接引用各模块的 `*/docs/**.md`
docs_dir: ..

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search
  - literate-nav:
      # 站点目录（SSOT）：`docs/SUMMARY.md`（相对 docs_dir 的路径）
      nav_file: docs/SUMMARY.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
