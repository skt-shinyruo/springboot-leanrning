site_name: Spring Boot Learning（文档站）
site_description: 文档统一入口（docs/）+ 模块文档 + 主线之书（Book）
site_dir: .site
docs_dir: ../docs

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search
  - literate-nav:
      # 站点目录（SSOT）：`docs/SUMMARY.md`（相对 docs_dir 的路径）
      nav_file: SUMMARY.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
